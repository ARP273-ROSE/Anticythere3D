name: build

# Tests à chaque push et pull request. Les paquets — installeur Windows, image
# disque macOS, archive Linux, archive de mise à jour commune — sont construits
# par .github/workflows/release.yml, déclenché par un tag « v* ». Il n'y a
# plus d'exécutable PyInstaller : Defender le mettait en quarantaine.
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (sans écran)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Garde-fou confidentialité (fichiers, PDF, PNG, binaires)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install pytest
          python -m pytest -q tests/test_confidentialite.py
      - name: Suite de tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_mechanism.py
      # Les tests d'interface ont besoin d'un VRAI serveur X (Xvfb) : le mode
      # « offscreen » de Qt ne fournit pas de contexte OpenGL, et c'est la vue
      # 3D — manivelle à la souris, éclatement — qu'ils vérifient.
      - name: Tests d'interface (Xvfb + OpenGL logiciel)
        run: |
          sudo apt-get install -y -qq xvfb libgl1 libegl1 libgl1-mesa-dri \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 libxcb-xkb1
          xvfb-run -a -s "-screen 0 1920x1080x24" python tests/test_gui.py
      - name: Export STL (contrôle de non-régression)
        run: |
          python -m anticythere.stl_export --out /tmp/stl
          test -f /tmp/stl/nomenclature.csv
