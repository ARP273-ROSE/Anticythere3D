name: build

# Tests sans écran à chaque push et pull request. La distribution Windows
# (paquet Python embarqué, installeur, archive de mise à jour) est construite
# par le gabarit du kit, .github/workflows/release-windows.yml, déclenché par
# un tag « v* » — comme MusicOthèque et le simulateur Perce-Neige. Il n'y a
# plus d'exécutable PyInstaller : Defender le mettait en quarantaine.
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (sans écran)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Garde-fou confidentialité (fichiers, PDF, PNG, binaires)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install pytest
          python -m pytest -q tests/test_confidentialite.py
      - name: Suite de tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_mechanism.py
      - name: Export STL (contrôle de non-régression)
        run: |
          python -m anticythere.stl_export --out /tmp/stl
          test -f /tmp/stl/nomenclature.csv
